name: Build APK (test decompiled Java)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q duyquyen.zip -d src
          echo "PROJ=$(dirname "$(find src -maxdepth 3 -name settings.gradle | head -1)")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace > build.log 2>&1
          code=$?
          echo "=== LOI ==="
          grep -E "error:|^e: |What went wrong" -A4 build.log | head -80
          tail -n 20 build.log
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: GolikeMulti-javatest-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
