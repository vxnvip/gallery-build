name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q Simple-Gallery-github.zip -d src
          echo "PROJ=$(dirname "$(find src -name settings.gradle | head -1)")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Accept licenses
        run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "LOI: secret DEBUG_KEYSTORE_B64 rong hoac chua tao"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
      - name: Check key
        run: |
          ls -l ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i -E "androiddebugkey|sha"
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --continue > build.log 2>&1
          code=$?
          echo "=== LOI ==="
          grep -E "^e: " build.log | head -60
          tail -n 15 build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleGallery-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
