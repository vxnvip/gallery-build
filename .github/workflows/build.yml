name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================
      # UNZIP PROJECT
      # =========================
      - name: Unzip project
        run: |
          unzip -q Simple-Gallery-github.zip -d src
          echo "PROJ=$(dirname "$(find src -name settings.gradle | head -1)")" >> "$GITHUB_ENV"

      # =========================
      # JAVA (không cache ở đây, setup-gradle lo)
      # =========================
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================
      # GRADLE (cache dependency + build cache)
      # SDK platform 35 / build-tools 35.0.0 đã có sẵn trên runner
      # =========================
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      # =========================
      # FIXED SIGNING KEY
      # KHÔNG ĐỤNG CƠ CHẾ CHỮ KÝ
      # =========================
      - name: Restore fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "LOI: secret rong"
            exit 1
          fi

          mkdir -p ~/.android

          echo "$KS" |
            tr -d '[:space:]' |
            base64 --decode > ~/.android/debug.keystore

          chmod 600 ~/.android/debug.keystore

      # =========================
      # VERIFY SIGNING KEY
      # KHÔNG ĐỔI
      # =========================
      - name: Check signing key
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey |
            grep -E "Alias name:|Entry type:|SHA-256:"

      # =========================
      # BUILD
      # =========================
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: |
          set +e

          # Tối ưu JVM qua gradle.properties (tránh lỗi tách dấu cách trong GRADLE_OPTS)
          echo "" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.workers.max=4" >> gradle.properties
          echo "kotlin.incremental=false" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties

          gradle assembleDebug \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon \
            --build-cache \
            --configuration-cache \
            --parallel \
            --console=plain \
            --continue > build.log 2>&1

          code=$?

          echo "=== LOI ==="
          grep -E "^e: " build.log | head -60

          echo "=== CUOI LOG ==="
          tail -n 15 build.log

          exit $code

      # =========================
      # VERIFY APK SIGNATURE
      # KHÔNG ĐỔI
      # =========================
      - name: Verify APK signature
        run: |
          out=$(
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
              --print-certs \
              ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk |
              grep SHA-256
          )

          echo "$out"

          echo "$out" |
            grep -q 322a8179607bd784 ||
            {
              echo "SAI KEY"
              exit 1
            }

      # =========================
      # UPLOAD APK
      # =========================
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleGallery-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
