name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q duyquyen.zip -d src
          echo "PROJ=$(dirname "$(find src -maxdepth 3 -name settings.gradle | head -1)")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Restore signing key (neu co secret)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | tr -d '[:space:]' | base64 --decode > ~/.android/debug.keystore
            chmod 600 ~/.android/debug.keystore
            echo "Dung key co dinh"
          else
            echo "Khong co secret -> dung debug key mac dinh"
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: |
          set +e
          gradle :app:assembleDebug \
            -x test -x lint \
            --no-daemon --console=plain --stacktrace > build.log 2>&1
          code=$?
          echo "=== LOI ==="
          grep -E "error:|^e: |What went wrong" -A4 build.log | head -80
          tail -n 20 build.log
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: Apk2Java-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
