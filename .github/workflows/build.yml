name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q Simple-Gallery-github.zip -d src
          echo "PROJ=$(dirname "$(find src -name settings.gradle | head -1)")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Accept licenses
        run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: A - kapt stubs (log chi tiet)
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: |
          gradle :app:kaptGenerateStubsDebugKotlin --no-daemon --info --console=plain > ../../build-A.log 2>&1 || true
          echo "=== A: LOI ==="
          grep -n -E "^e: |Exception|Caused by|incompatible|Could not load" ../../build-A.log | head -40

      - name: B - tat kapt de Kotlin in loi that
        continue-on-error: true
        run: |
          cp -r "$PROJ" /tmp/nokapt
          cd /tmp/nokapt
          sed -i "/org.jetbrains.kotlin.kapt/d;/^ *kapt /d" app/build.gradle
          gradle :app:compileDebugKotlin --no-daemon --console=plain --continue > $GITHUB_WORKSPACE/build-B.log 2>&1 || true
          echo "=== B: LOI THAT ==="
          grep -E "^e: " $GITHUB_WORKSPACE/build-B.log | sed 's#file:///[^ ]*/src/##' | head -80
          echo "=== B: dong cuoi ==="
          tail -n 15 $GITHUB_WORKSPACE/build-B.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-A.log
            build-B.log
